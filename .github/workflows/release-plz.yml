name: Release (release-plz)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Which release-plz command to run"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - release-pr

# Restrict default permissions to read-only
permissions:
  contents: read

env:
  # `cargo publish` compiles every crate; CI does not want incremental churn
  # (see [profile.dev] in Cargo.toml, which enables it for local dev).
  CARGO_INCREMENTAL: "0"

jobs:
  # `release-plz release` publishes only versions present in the manifests and absent
  # from crates.io, so running it on every push is safe and makes an interrupted release
  # self-healing: the next push to main finishes it. That is why this needs no
  # pull_request trigger and no label matching to decide whether a release is happening.
  release:
    name: Publish crates
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.repository == 'constructorfabric/gears-rust'
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
        )
      }}
    # No concurrency group, deliberately. Any group can cancel a *pending* run when a
    # newer one joins it, and a skipped publish is silent — no crates, no tags, no
    # failure. release-plz's docs mandate this: "the concurrency block cancels the
    # pending job if a new commit is pushed — we can't risk to skip a release." Two
    # concurrent publishes are harmless, since each publishes only what crates.io lacks.
    # The release App's private key is a secret of `ci-trusted`, which only a push to main
    # enters; any other run gets no key and falls back to GITHUB_TOKEN.
    environment:
      name: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'ci-trusted' || '' }}
      deployment: false
    permissions:
      contents: write
      # release-plz resolves PR numbers and contributors for changelogs and releases.
      pull-requests: read
    # Exposed so the publish jobs below know what was released. `releases` is a JSON
    # array of {package_name, tag, version}; empty when nothing was published.
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    steps:
      # No `ref:` needed. On push, checkout defaults to github.sha, which is exactly the
      # commit that was pushed — for a release PR merge, its merge commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Disk report (before cleanup)
        run: |
          set -euxo pipefail
          df -h
          du -sh . || true
          du -xh . | sort -h | tail -n 40 || true

      # Removing ~/.cargo/registry also clears its `index` subdirectory, which is the
      # workaround for release-plz's gix slotmap overflow. Nothing between here and the
      # publish repopulates it: free-disk-space, setup-go, setup-protoc and
      # `rustup toolchain install` download no crates.
      - name: Runner-local cache cleanup
        run: |
          set -euxo pipefail
          rm -rf target || true
          rm -rf ~/.cargo/registry ~/.cargo/git || true
          df -h

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install protoc
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: protoc@3.34.1

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # No test run here. ci.yml tests every push to main, and merging a release PR is
      # the maintainer's release decision — re-testing could only override it, never
      # inform it. `cargo publish` still compiles every crate, so a crate that does not
      # build cannot be published.

      # Own App budget, separate from the shared GITHUB_TOKEN pool (GitHub App per workflow family)
      - name: Mint gears-rust-release app token
        id: app
        # Unset variable, or a fork/Dependabot run without secrets: skip and fall back to GITHUB_TOKEN.
        if: >-
          vars.GEARS_RELEASE_APP_CLIENT_ID != '' &&
          github.actor != 'dependabot[bot]' &&
          !github.event.pull_request.head.repo.fork
        continue-on-error: true  # a bad key or missing install must never fail the job
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GEARS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GEARS_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - name: Report API token source
        env:
          APP_TOKEN_SET: ${{ steps.app.outputs.token != '' }}
          MINT_OUTCOME: ${{ steps.app.outcome }}
          API_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          if [ "$APP_TOKEN_SET" = true ]; then src=gears-rust-release; echo "::notice::GitHub API token: gears-rust-release app"
          elif [ "$MINT_OUTCOME" = failure ]; then src=github-token; echo "::warning::gears-rust-release app token mint failed; using GITHUB_TOKEN"
          else src=github-token; echo "::notice::GitHub API token: GITHUB_TOKEN (gears-rust-release app not configured or fork run)"; fi
          # GET /rate_limit is free; one sample per job gives a per-token time series (see the API limits plan).
          core=$(curl -fsS -m 10 -H "Authorization: Bearer $API_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/rate_limit 2>/dev/null | tr -d ' \n' | sed -n 's/.*"core":{\([^}]*\)}.*/\1/p' | tr -d '"' | tr ',' ' ' | sed 's/:/=/g') || true
          echo "RATE-APP ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) token=$src workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB ${core:-unavailable}"

      - name: release-plz release
        id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.3.155
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

      - name: Disk report (post-mortem)
        if: always()
        run: df -h

  release-pr:
    name: Create release PR
    runs-on: ${{ (vars.GEARS_FORCE_GITHUB_HOSTED == 'true' || github.repository != 'constructorfabric/gears-rust' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'gears-large' }}
    # Ordered after `release` so release-plz never derives the next versions from
    # crates.io while a publish is mid-flight. `!cancelled()` keeps this running when
    # `release` was skipped (manual release-pr dispatch) or failed.
    needs: release
    if: >-
      ${{
        !cancelled()
        && github.repository == 'constructorfabric/gears-rust'
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release-pr')
        )
      }}
    # Let a running instance finish — it is part-way through committing and force-pushing
    # the release branch — and keep only the newest waiting one.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    # Only a push to main enters the environment, whose read-write key for the
    # shared build cache GitHub releases to main alone; every other run reads.
    environment:
      name: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'ci-trusted' || '' }}
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # cargo-semver-checks (via release-plz/action >= 0.5.136) rustdocs toolkit
      # with extra features, including contract-grpc-client and fips. That pulls
      # prost-build (needs protoc) and aws-lc-fips-sys (needs Go). The publish
      # job already installs both; this job did not, and started failing on
      # every push to main after #4831.
      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install protoc
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: protoc@3.34.1

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # cargo-semver-checks compiles the crates it documents; the shared cache
      # takes the dependency half of that.
      - name: Set up the shared build cache
        id: cache
        uses: ./.github/actions/ci-cache
        with:
          rw-key-id: ${{ secrets.CI_CACHE_RW_KEY_ID }}
          rw-secret: ${{ secrets.CI_CACHE_RW_SECRET }}
          trusted: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          rust: true
          downloads: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          downloads-key: cargo-${{ hashFiles('**/Cargo.lock') }}
          downloads-restore-keys: cargo-

      - name: Mint gears-rust-release app token
        id: app
        # Unset variable, or a fork/Dependabot run without secrets: skip and fall back to GITHUB_TOKEN.
        if: >-
          vars.GEARS_RELEASE_APP_CLIENT_ID != '' &&
          github.actor != 'dependabot[bot]' &&
          !github.event.pull_request.head.repo.fork
        continue-on-error: true  # a bad key or missing install must never fail the job
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GEARS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GEARS_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Report API token source
        env:
          APP_TOKEN_SET: ${{ steps.app.outputs.token != '' }}
          MINT_OUTCOME: ${{ steps.app.outcome }}
          API_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          if [ "$APP_TOKEN_SET" = true ]; then src=gears-rust-release; echo "::notice::GitHub API token: gears-rust-release app"
          elif [ "$MINT_OUTCOME" = failure ]; then src=github-token; echo "::warning::gears-rust-release app token mint failed; using GITHUB_TOKEN"
          else src=github-token; echo "::notice::GitHub API token: GITHUB_TOKEN (gears-rust-release app not configured or fork run)"; fi
          # GET /rate_limit is free; one sample per job gives a per-token time series (see the API limits plan).
          core=$(curl -fsS -m 10 -H "Authorization: Bearer $API_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/rate_limit 2>/dev/null | tr -d ' \n' | sed -n 's/.*"core":{\([^}]*\)}.*/\1/p' | tr -d '"' | tr ',' ' ' | sed 's/:/=/g') || true
          echo "RATE-APP ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) token=$src workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB ${core:-unavailable}"

      - name: release-plz release-pr
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.3.155
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          # Share one build directory across release-plz tasks to save disk space.
          CARGO_TARGET_DIR: ${{ runner.temp }}/release-plz-target

  # Publish the Docker image + Helm chart for each released, publishable gear, in this
  # same run. Driven by release-plz's `releases` output, NOT by tag pushes: GitHub
  # suppresses tag/`push` events for a release of >3 crates anyway. Tags and the release
  # PR are created with the gears-rust-release App token (GITHUB_TOKEN is only the
  # fallback), so they DO trigger workflows: never add a `push: tags` / `release` /
  # `create` trigger that publishes, or it would publish a second time. Reading the
  # output sidesteps both. (Regular gears are publish=true; examples and flight-control
  # are git_only — either way they appear in `releases`. The toolkit-platform umbrella
  # isn't a crate, so it's published via workflow_dispatch on publish-artifacts.yml.)
  plan-publish:
    name: Plan publish
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build publish matrix from released packages
        id: plan
        # Maps release-plz's `releases` to a {component, version} matrix of the
        # released gears that are publishable; non-gear crates are skipped.
        env:
          RELEASES: ${{ needs.release.outputs.releases }}
        run: python3 tools/scripts/resolve_release.py plan

  publish:
    name: Publish (${{ matrix.entry.component }} ${{ matrix.entry.version }})
    needs: plan-publish
    if: needs.plan-publish.outputs.any == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      # Cap concurrent publishes so a large release doesn't saturate runners.
      max-parallel: 4
      matrix:
        entry: ${{ fromJSON(needs.plan-publish.outputs.matrix) }}
    uses: ./.github/workflows/publish-artifacts.yml
    with:
      component: ${{ matrix.entry.component }}
      version: ${{ matrix.entry.version }}
      latest: true
    secrets: inherit
