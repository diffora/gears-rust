# Updated: 2026-04-20 by Constructor Tech
name: CFS

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'gears/**/docs/**'
      - 'gears/**/src/**'
      - 'gears/**/tests/**'
      - '.cf-studio/config/**'
      - '.cf-studio-kit.toml'
      - 'studio-kit-gears/**'
      - 'Makefile'
      - '.gears-dna/gears.mk'
      - 'gears-rust.mk'
  workflow_call:
    secrets:
      GEARS_CI_APP_PRIVATE_KEY:
        description: gears-rust-ci App private key; absent means fall back to GITHUB_TOKEN
        required: false
  workflow_dispatch:

concurrency:
  group: cfs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Local dev enables incremental compilation via [profile.dev]; CI does not want
  # the extra codegen and disk churn.
  CARGO_INCREMENTAL: "0"

jobs:
  validate_artifacts:
    name: Validate CFS Artifacts
    runs-on: ${{ (vars.GEARS_FORCE_GITHUB_HOSTED == 'true' || github.repository != 'constructorfabric/gears-rust' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'gears-small' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: 'true'
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Setup pipx
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath

      # Own App budget, separate from the shared GITHUB_TOKEN pool (GitHub App per workflow family)
      - name: Mint gears-rust-ci app token
        id: app
        # Unset variable, or a fork/Dependabot run without secrets: skip and fall back to GITHUB_TOKEN.
        if: >-
          vars.GEARS_CI_APP_CLIENT_ID != '' &&
          github.actor != 'dependabot[bot]' &&
          !github.event.pull_request.head.repo.fork
        continue-on-error: true  # a bad key or missing install must never fail the job
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GEARS_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.GEARS_CI_APP_PRIVATE_KEY }}
          permission-contents: read
      - name: Report API token source
        shell: bash
        env:
          APP_TOKEN_SET: ${{ steps.app.outputs.token != '' }}
          MINT_OUTCOME: ${{ steps.app.outcome }}
          API_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          if [ "$APP_TOKEN_SET" = true ]; then src=gears-rust-ci; echo "::notice::GitHub API token: gears-rust-ci app"
          elif [ "$MINT_OUTCOME" = failure ]; then src=github-token; echo "::warning::gears-rust-ci app token mint failed; using GITHUB_TOKEN"
          else src=github-token; echo "::notice::GitHub API token: GITHUB_TOKEN (gears-rust-ci app not configured or fork run)"; fi
          # GET /rate_limit is free; one sample per job gives a per-token time series (see the API limits plan).
          core=$(curl -fsS -m 10 -H "Authorization: Bearer $API_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/rate_limit 2>/dev/null | tr -d ' \n' | sed -n 's/.*"core":{\([^}]*\)}.*/\1/p' | tr -d '"' | tr ',' ' ' | sed 's/:/=/g') || true
          echo "RATE-APP ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) token=$src workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB ${core:-unavailable}"

      - name: Validate artifacts
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: make cfs-validate

      - name: Validate registered kits
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: make cfs-validate-kits

      - name: Detect local kit changes
        id: local_kit_changes
        shell: bash
        run: |
          base_ref="${{ github.base_ref }}"

          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$base_ref" ]; then
            # Full (not --depth=1) fetch so the three-dot diff can find a merge
            # base: checkout uses fetch-depth: 0 (full HEAD), so a shallow base
            # ref has no reachable common ancestor and the diff fails with
            # "no merge base" (notably on fork PRs). Tolerate a failed fetch and
            # a failed diff so this detection step never hard-fails the job (the
            # run shell is `bash -eo pipefail`, so an unguarded fetch would exit).
            git fetch --no-tags origin "$base_ref" || true
            changed_files="$(git diff --name-only "origin/$base_ref"...HEAD 2>/dev/null || true)"
          else
            changed_files="$(
              git diff --name-only HEAD~1 HEAD 2>/dev/null || true
              git status --short | sed 's/^...//'
            )"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(studio-kit-gears/|\.cf-studio/config/|\.cf-studio-kit\.toml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate local Gears kit
        if: steps.local_kit_changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: make cfs-validate-kit-local
