name: PR Reviewer Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  check-reviewers:
    # Disabled to stop automated PR comments and Telegram notifications.
    if: false
    runs-on: ${{ (vars.GEARS_FORCE_GITHUB_HOSTED == 'true' || github.repository != 'constructorfabric/gears-rust' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'gears-small-vm' }}
    steps:
      # Own App budget, separate from the shared GITHUB_TOKEN pool (GitHub App per workflow family)
      - name: Mint gears-rust-nightly app token
        id: app
        # Unset variable, or a fork/Dependabot run without secrets: skip and fall back to GITHUB_TOKEN.
        if: >-
          vars.GEARS_NIGHTLY_APP_CLIENT_ID != '' &&
          github.actor != 'dependabot[bot]' &&
          !github.event.pull_request.head.repo.fork
        continue-on-error: true  # a bad key or missing install must never fail the job
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GEARS_NIGHTLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.GEARS_NIGHTLY_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write
          permission-contents: read
      - name: Report API token source
        if: always()
        env:
          APP_TOKEN_SET: ${{ steps.app.outputs.token != '' }}
          MINT_OUTCOME: ${{ steps.app.outcome }}
          API_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          if [ "$APP_TOKEN_SET" = true ]; then src=gears-rust-nightly; echo "::notice::GitHub API token: gears-rust-nightly app"
          elif [ "$MINT_OUTCOME" = failure ]; then src=github-token; echo "::warning::gears-rust-nightly app token mint failed; using GITHUB_TOKEN"
          else src=github-token; echo "::notice::GitHub API token: GITHUB_TOKEN (gears-rust-nightly app not configured or fork run)"; fi
          # GET /rate_limit is free; one sample per job gives a per-token time series (see the API limits plan).
          core=$(curl -fsS -m 10 -H "Authorization: Bearer $API_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/rate_limit 2>/dev/null | tr -d ' \n' | sed -n 's/.*"core":{\([^}]*\)}.*/\1/p' | tr -d '"' | tr ',' ' ' | sed 's/:/=/g') || true
          echo "RATE-APP ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) token=$src workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB ${core:-unavailable}"

      - name: Check reviewers and notify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const ignoredReviewers = new Set([
              "coderabbitai[bot]",
              "graphite-app[bot]",
              "dependabot[bot]"
            ]);

            const NOTIFICATION_MARKER = "<!-- pr-reviewer-check-notify -->";

            // Fetch all open PRs
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            const tenMinutesAgo = new Date(Date.now() - 10 * 60 * 1000);

            for (const pr of prs) {
              const title = pr.title.toLowerCase();
              if (title.startsWith("chore: release")) continue;

              const isInternal = pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`;
              if (!isInternal) continue;

              const createdAt = new Date(pr.created_at);
              if (createdAt > tenMinutesAgo) continue;

              const humanReviewers = (pr.requested_reviewers || [])
                .map(r => r.login)
                .filter(login =>
                  !login.endsWith("[bot]") &&
                  !ignoredReviewers.has(login)
                );

              const humanTeams = pr.requested_teams || [];
              if (humanReviewers.length > 0 || humanTeams.length > 0) continue;
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr.number
              });
              const humanReviewed = reviews
                .map(r => r.user?.login)
                .filter(login =>
                  login &&
                  !login.endsWith("[bot]") &&
                  !ignoredReviewers.has(login)
                );
              if (humanReviewed.length > 0) continue;

              // Check if we already commented
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number
              });

              const alreadyCommented = comments.some(c =>
                c.body.includes(NOTIFICATION_MARKER) ||
                (c.user &&
                c.user.type === 'Bot' &&
                c.body.includes("PR was created more than") &&
                c.body.includes("has no human reviewers assigned"))
              );

              if (alreadyCommented) {
                console.log(`PR #${pr.number} already has notification comment`);
                continue;
              }

              const prUrl = pr.html_url;
              const message =
                "PR has no human reviewers assigned 10 minutes after creation.\n\n" +
                "Repository: " + owner + "/" + repo + "\n" +
                "PR: #" + pr.number + "\n" +
                "Title: " + pr.title + "\n" +
                "URL: " + prUrl + "\n" +
                prUrl;

              console.log(`Notifying for PR #${pr.number}`);

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body:
                  "PR was created more than 10 minutes ago but has no human reviewers assigned\n" + NOTIFICATION_MARKER
              });

              try {
                const resp = await fetch(
                  `https://api.telegram.org/bot${
                    process.env.TELEGRAM_BOT_TOKEN
                  }/sendMessage`,
                  {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      chat_id: process.env.TELEGRAM_CHAT_ID,
                      text: message
                    })
                  }
                );
                if (!resp.ok) {
                  const body = await resp.text().catch(() => "");
                  console.error(
                    `Telegram API error ${resp.status} ${resp.statusText}`,
                    body
                  );
                }
              } catch (error) {
                console.error("Failed to send Telegram message", error);
              }
            }
