name: PR Governance

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 13 * * *"

  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  unanswered-review-check:
    # Disabled to stop automated unresolved-comment reminders and Telegram notifications.
    if: false
    runs-on: ${{ (vars.GEARS_FORCE_GITHUB_HOSTED == 'true' || github.repository != 'constructorfabric/gears-rust' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'gears-small-vm' }}

    steps:
      # Own App budget, separate from the shared GITHUB_TOKEN pool (GitHub App per workflow family)
      - name: Mint gears-rust-nightly app token
        id: app
        # Unset variable, or a fork/Dependabot run without secrets: skip and fall back to GITHUB_TOKEN.
        if: >-
          vars.GEARS_NIGHTLY_APP_CLIENT_ID != '' &&
          github.actor != 'dependabot[bot]' &&
          !github.event.pull_request.head.repo.fork
        continue-on-error: true  # a bad key or missing install must never fail the job
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GEARS_NIGHTLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.GEARS_NIGHTLY_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write
          permission-contents: read
      - name: Report API token source
        if: always()
        env:
          APP_TOKEN_SET: ${{ steps.app.outputs.token != '' }}
          MINT_OUTCOME: ${{ steps.app.outcome }}
          API_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          if [ "$APP_TOKEN_SET" = true ]; then src=gears-rust-nightly; echo "::notice::GitHub API token: gears-rust-nightly app"
          elif [ "$MINT_OUTCOME" = failure ]; then src=github-token; echo "::warning::gears-rust-nightly app token mint failed; using GITHUB_TOKEN"
          else src=github-token; echo "::notice::GitHub API token: GITHUB_TOKEN (gears-rust-nightly app not configured or fork run)"; fi
          # GET /rate_limit is free; one sample per job gives a per-token time series (see the API limits plan).
          core=$(curl -fsS -m 10 -H "Authorization: Bearer $API_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/rate_limit 2>/dev/null | tr -d ' \n' | sed -n 's/.*"core":{\([^}]*\)}.*/\1/p' | tr -d '"' | tr ',' ' ' | sed 's/:/=/g') || true
          echo "RATE-APP ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) token=$src workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB ${core:-unavailable}"

      - name: Scan unanswered review comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const ignoredBots = new Set([
              "coderabbitai[bot]",
              "graphite-app[bot]",
              "dependabot[bot]"
            ]);

            const prs = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: "open",
                per_page: 100
              }
            );

            for (const pr of prs) {

              const title = pr.title.toLowerCase();

              if (title.startsWith("chore: release")) {
                continue;
              }

              const reviewData = await github.graphql(
                `
                query($owner:String!, $repo:String!, $number:Int!) {
                  repository(owner:$owner, name:$repo) {
                    pullRequest(number:$number) {
                      author { login }
                      reviewThreads(first:100) {
                        nodes {
                          isResolved
                          comments(last:10) {
                            totalCount
                            nodes {
                              author { login }
                            }
                          }
                        }
                      }
                    }
                  }
                }
                `,
                {
                  owner,
                  repo,
                  number: pr.number
                }
              );

              const author =
                reviewData.repository.pullRequest.author?.login;
              if (!author) {
                console.log(`Skipping PR #${pr.number} - author is null`);
                continue;
              }

              const threads =
                reviewData.repository.pullRequest.reviewThreads.nodes;

              let unanswered = 0;
              let unresolvedComments = 0;

              for (const thread of threads) {
                if (thread.isResolved) continue;

                const comments = thread.comments.nodes;
                if (!comments.length) continue;

                unresolvedComments += thread.comments.totalCount;

                const lastHuman =
                  [...comments]
                    .reverse()
                    .find(c => {
                      const login = c.author?.login;
                      return (
                        !!login &&
                        !login.endsWith("[bot]") &&
                        !ignoredBots.has(login)
                      );
                    });

                if (!lastHuman) continue;

                const lastHumanLogin = lastHuman.author.login;

                if (lastHumanLogin !== author) {
                  unanswered++;
                }
              }

              if (unanswered === 0) continue;

              const prUrl = pr.html_url;

              const message =
                "PR has unanswered reviewer comments.\n\n" +
                "Repository: " + owner + "/" + repo + "\n" +
                "PR: #" + pr.number + "\n" +
                "Title: " + pr.title + "\n" +
                "Unanswered threads: " + unanswered + "\n" +
                "Unresolved comments: " + unresolvedComments + "\n" +
                "URL: " + prUrl + "\n" +
                prUrl;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body:
                  "There are unresolved review comments awaiting response.\n\n" +
                  "Unanswered human review threads: " + unanswered + "\n" +
                  "Unresolved comments: " + unresolvedComments
              });

              await fetch(
                "https://api.telegram.org/bot" +
                  process.env.TELEGRAM_BOT_TOKEN +
                  "/sendMessage",
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    chat_id: process.env.TELEGRAM_CHAT_ID,
                    text: message
                  })
                }
              );
            }
