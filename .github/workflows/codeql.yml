# CodeQL code scanning.
#
# Full Rust analysis costs ~1h of runner time (codeql-action has no overlay/incremental
# mode for Rust), so pull requests run it only when non-test `.rs` files change.
# Drafts and PRs without Rust, Python or `.github` changes are not scanned at all.
# Scheduled and manual runs always analyze everything.
name: "CodeQL Advanced"

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  schedule:
    - cron: '40 23 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Local dev enables incremental compilation via [profile.dev]; CI does not want
  # the extra codegen and disk churn.
  CARGO_INCREMENTAL: "0"

jobs:
  select:
    name: Select CodeQL languages
    runs-on: ${{ (vars.GEARS_FORCE_GITHUB_HOSTED == 'true' || github.repository != 'constructorfabric/gears-rust' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'gears-small' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scan: ${{ steps.choose.outputs.scan }}
      rust: ${{ steps.choose.outputs.rust }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Own App budget, separate from the shared GITHUB_TOKEN pool (GitHub App per workflow family)
      - name: Mint gears-rust-ci app token
        id: app
        # Unset variable, or a fork/Dependabot run without secrets: skip and fall back to GITHUB_TOKEN.
        if: >-
          vars.GEARS_CI_APP_CLIENT_ID != '' &&
          github.actor != 'dependabot[bot]' &&
          !github.event.pull_request.head.repo.fork
        continue-on-error: true  # a bad key or missing install must never fail the job
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GEARS_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.GEARS_CI_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
      - name: Report API token source
        shell: bash
        env:
          APP_TOKEN_SET: ${{ steps.app.outputs.token != '' }}
          MINT_OUTCOME: ${{ steps.app.outcome }}
          API_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          if [ "$APP_TOKEN_SET" = true ]; then src=gears-rust-ci; echo "::notice::GitHub API token: gears-rust-ci app"
          elif [ "$MINT_OUTCOME" = failure ]; then src=github-token; echo "::warning::gears-rust-ci app token mint failed; using GITHUB_TOKEN"
          else src=github-token; echo "::notice::GitHub API token: GITHUB_TOKEN (gears-rust-ci app not configured or fork run)"; fi
          # GET /rate_limit is free; one sample per job gives a per-token time series (see the API limits plan).
          core=$(curl -fsS -m 10 -H "Authorization: Bearer $API_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/rate_limit 2>/dev/null | tr -d ' \n' | sed -n 's/.*"core":{\([^}]*\)}.*/\1/p' | tr -d '"' | tr ',' ' ' | sed 's/:/=/g') || true
          echo "RATE-APP ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) token=$src workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB ${core:-unavailable}"

      - name: Select scan mode from changed files
        id: choose
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          emit() { printf 'scan=%s\nrust=%s\n' "$1" "$2" | tee -a "$GITHUB_OUTPUT"; }

          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then emit true full; exit 0; fi
          if [[ "$IS_DRAFT" == true ]]; then echo 'Draft PR: skipping CodeQL.'; emit false stub; exit 0; fi

          # The changed-file list comes from git first: the REST call below hit the
          # installation rate limit (HTTP 403) and flipped docs-only PRs to full scans.
          # Fail closed: failure, empty or possibly truncated (3,000-file cap) list => next
          # source; the REST API is the fallback and a full scan the last resort.
          files=
          if git fetch --no-tags --depth=1 origin "$BASE_SHA" \
             && files="$(git diff --no-renames --name-only "$BASE_SHA" HEAD)" \
             && [[ -n "$files" ]] && (( $(wc -l <<< "$files") < 3000 )); then
            :
          else
            echo 'git diff file list unavailable; falling back to the REST API.' >&2
            if ! files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')" \
               || [[ -z "$files" ]] || (( $(wc -l <<< "$files") >= 3000 )); then
              echo 'Incomplete PR file list; running a full scan.' >&2
              emit true full; exit 0
            fi
          fi

          # Only `.rs` sources and this workflow trigger a full Rust scan. Manifests
          # (Cargo.toml/lock, rust-toolchain, .cargo/, .proto) do not: Rust alerts are
          # located only in `.rs` files and codeql-action drops alerts outside the PR
          # diff before upload, so a full scan of such a PR would report nothing either.
          # The exclusions mirror `paths-ignore` below (keep both in sync).
          rust_files="$(grep -E '\.rs$|^\.github/workflows/codeql\.yml$' <<< "$files" || true)"
          if [[ -n "$rust_files" ]] && grep -Evq '(^|/)(tests|benches)/|(^|/|_)tests?\.rs$|(^|/)examples/|^tools/fuzz/' <<< "$rust_files"; then
            emit true full
          elif grep -Eq '\.py$|(^|/)(pyproject\.toml|requirements[^/]*\.txt|poetry\.lock)$|^\.github/' <<< "$files"; then
            emit true stub
          else
            emit false stub
          fi

  analyze:
    needs: select
    if: needs.select.outputs.scan == 'true'
    name: Analyze (${{ matrix.language }})
    # The Rust leg builds nothing (`build-mode: none`) but still extracts the whole
    # workspace; the Python and Actions legs fit a small runner.
    runs-on: ${{ (vars.GEARS_FORCE_GITHUB_HOSTED == 'true' || github.repository != 'constructorfabric/gears-rust' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || (matrix.language == 'rust' && 'gears-large' || 'gears-small') }}
    timeout-minutes: 90
    permissions:
      # Required to upload SARIF results.
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Every scanned PR must upload all categories: a missing one turns the PR's code
        # scanning check neutral ("configuration not found") and hides its new alerts.
        language: [ rust, python, actions ]
    env:
      RUST_STUB: ${{ matrix.language == 'rust' && needs.select.outputs.rust == 'stub' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Rust stub: check out only `.github/` so the extractor sees just the stub crate.
        sparse-checkout: ${{ env.RUST_STUB == 'true' && '/.github/' || '' }}
        sparse-checkout-cone-mode: false

    - name: Create Rust stub crate
      if: env.RUST_STUB == 'true'
      shell: bash
      run: |
        # No non-test `.rs` changes: analyze a one-line crate instead of the workspace so
        # the `/language:rust` configuration is still uploaded. Diff-informed analysis
        # reports only alerts on changed lines, so this matches a full scan's outcome.
        mkdir codeql-rust-stub
        printf '[package]\nname = "codeql-rust-stub"\nversion = "0.0.0"\nedition = "2021"\npublish = false\n\n[lib]\npath = "lib.rs"\n' \
          > codeql-rust-stub/Cargo.toml
        echo 'pub fn stub() {}' > codeql-rust-stub/lib.rs

    - name: Mint gears-rust-ci app token
      id: app
      # Unset variable, or a fork/Dependabot run without secrets: skip and fall back to GITHUB_TOKEN.
      if: >-
        vars.GEARS_CI_APP_CLIENT_ID != '' &&
        github.actor != 'dependabot[bot]' &&
        !github.event.pull_request.head.repo.fork
      continue-on-error: true  # a bad key or missing install must never fail the job
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ vars.GEARS_CI_APP_CLIENT_ID }}
        private-key: ${{ secrets.GEARS_CI_APP_PRIVATE_KEY }}
        permission-security-events: write
        permission-contents: read
    - name: Report API token source
      shell: bash
      env:
        APP_TOKEN_SET: ${{ steps.app.outputs.token != '' }}
        MINT_OUTCOME: ${{ steps.app.outcome }}
        API_TOKEN: ${{ steps.app.outputs.token || github.token }}
      run: |
        if [ "$APP_TOKEN_SET" = true ]; then src=gears-rust-ci; echo "::notice::GitHub API token: gears-rust-ci app"
        elif [ "$MINT_OUTCOME" = failure ]; then src=github-token; echo "::warning::gears-rust-ci app token mint failed; using GITHUB_TOKEN"
        else src=github-token; echo "::notice::GitHub API token: GITHUB_TOKEN (gears-rust-ci app not configured or fork run)"; fi
        # GET /rate_limit is free; one sample per job gives a per-token time series (see the API limits plan).
        core=$(curl -fsS -m 10 -H "Authorization: Bearer $API_TOKEN" -H "Accept: application/vnd.github+json" \
          https://api.github.com/rate_limit 2>/dev/null | tr -d ' \n' | sed -n 's/.*"core":{\([^}]*\)}.*/\1/p' | tr -d '"' | tr ',' ' ' | sed 's/:/=/g') || true
        echo "RATE-APP ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) token=$src workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB ${core:-unavailable}"

    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        token: ${{ steps.app.outputs.token || github.token }}
        languages: ${{ matrix.language }}
        build-mode: none
        # Test code is ~46% of the Rust LOC and dominates query time. Applied to PR and
        # scheduled runs alike so alert comparison stays consistent. Keep in sync with
        # the Rust exclusion regex in the `select` job.
        config: |
          paths-ignore:
            - '**/tests/**'
            - '**/benches/**'
            - '**/tests.rs'
            - '**/test.rs'
            - '**/*_tests.rs'
            - '**/*_test.rs'
            - '**/examples/**'
            - 'tools/fuzz/**'

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        token: ${{ steps.app.outputs.token || github.token }}
        category: "/language:${{ matrix.language }}"
