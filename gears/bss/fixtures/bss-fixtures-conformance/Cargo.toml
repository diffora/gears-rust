[package]
name = "bss-fixtures-conformance"
edition.workspace = true
license.workspace = true
description = "Conformance harness over the BSS joint fixture corpus: the ChargeEvaluator trait, the suite runner, and the reference oracle implementing the pricing PRD §17.2 formula matrix. Gears take this as a dev-dependency only."

[lints]
workspace = true

[dependencies]
# The corpus types this harness runs against. `corpus` by name: the workspace
# default is the narrow production surface a gear compiles, and this harness is
# the half that reads the case files from disk.
bss-fixtures = { workspace = true, features = ["corpus"] }
# Typed evaluation errors.
thiserror = { workspace = true }
# Period arithmetic for the proration family (UTC instants only).
chrono = { workspace = true }
# `regen_registry` serialises the generated registry back to TOML.
toml = { workspace = true }
serde = { workspace = true }
