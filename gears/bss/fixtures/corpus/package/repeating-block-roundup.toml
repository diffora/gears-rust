family     = "package"
id         = "repeating-block-roundup"
kind       = "evaluation"
provenance = ["AC#60", "AC#88", "PRD §17.2"]

[snapshot]
model_kind          = "package"
currency            = "USD"
package_size        = 1000
package_price_minor = 2500
billing_granularity = "whole_unit"

[[assert]]
given  = { q = 0 }
expect = { charge_minor = 0 }
why    = "ceil(0/1000) is zero blocks, not one — no usage buys no block"

[[assert]]
given  = { q = 1 }
expect = { charge_minor = 2500 }
why    = "a partial block rounds up to one whole block"

[[assert]]
given  = { q = 1000 }
expect = { charge_minor = 2500 }
why    = "exactly one block; the boundary must not tip into two"

[[assert]]
given  = { q = 1001 }
expect = { charge_minor = 5000 }
why    = "ceil(1.001) is two blocks — a floor reading would halve this charge"

[[assert]]
given  = { q = 2000 }
expect = { charge_minor = 5000 }
why    = "two whole blocks; the second boundary behaves like the first"
