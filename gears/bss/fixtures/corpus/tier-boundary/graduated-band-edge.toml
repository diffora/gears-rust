family     = "tier-boundary"
id         = "graduated-band-edge"
kind       = "evaluation"
provenance = ["AC#60", "PRD §17.2", "D-17"]

[snapshot]
model_kind              = "graduated"
currency                = "USD"
tier_aggregation_window = "invoice_period"
billing_granularity     = "whole_unit"

  [[snapshot.bands]]
  from_qty = 0
  to_qty   = 1000
  unit_amount_minor = 5

  [[snapshot.bands]]
  from_qty = 1000
  to_qty   = "open"
  unit_amount_minor = 3

[[assert]]
given  = { q = 0 }
expect = { charge_minor = 0 }
why    = "no usage bills nothing; the open top band must not be reached"

[[assert]]
given  = { q = 999 }
expect = { charge_minor = 4995 }
why    = "the last unit inside band 1"

[[assert]]
given  = { q = 1000 }
expect = { charge_minor = 5000 }
why    = "half-open [from,to): q=1000 opens band 2, but graduated is marginal, so band 1 is consumed whole and band 2 contributes nothing"

[[assert]]
given  = { q = 1500 }
expect = { charge_minor = 6500 }
why    = "1000 units at 5 plus 500 at 3 — the marginal split"
