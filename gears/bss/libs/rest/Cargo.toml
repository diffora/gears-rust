[package]
name = "cf-gears-bss-rest"
edition.workspace = true
license.workspace = true
description = "Shared HTTP helpers for the BSS gears: a weak ETag over a response body and 304 on If-None-Match"

[lib]
name = "bss_rest"

[dependencies]
axum = { workspace = true }       # the response type the gears return
http = { workspace = true }       # HeaderMap, HeaderValue, status codes
aws-lc-rs = { workspace = true }  # SHA-256 of the served body
base64 = { workspace = true }     # base64url of that digest
serde = { workspace = true }      # Serialize bound on the response value
serde_json = { workspace = true } # the exact JSON bytes the tag covers

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
