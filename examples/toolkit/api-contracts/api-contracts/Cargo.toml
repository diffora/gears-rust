[package]
name = "cf-api-contracts"
version = "0.1.5"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "api-contracts example module — PaymentApi with local and HTTP transport"
rust-version.workspace = true
publish = false

[lib]
name = "cf_api_contracts"

[features]
# `grpc-client` is on so `cargo test --workspace` (what CI runs) covers the
# gRPC client, resolving and runtime tests of this example.
default = ["grpc-client"]
# OpenTelemetry in generated clients: W3C traceparent propagation + RED metrics.
otel = ["toolkit/otel", "api-contracts-sdk/otel"]
grpc-client = [
    "api-contracts-sdk/grpc-client",
    "toolkit-contract/grpc-client",
    "dep:tonic",
    "dep:toolkit-transport-grpc",
]
# Serve PaymentApi over gRPC: adds the `api-contracts-grpc` gear and links
# grpc-hub, which hosts the service and publishes it in the directory. Calls are
# authenticated with the in-process AuthN resolver. Not part of `oop_module`:
# the hub needs its own `gears.grpc-hub` config (listen and advertise address),
# which a deployment of the REST-only binary does not have.
grpc-server = ["grpc-client", "dep:grpc_hub", "dep:authn-resolver-sdk"]
# OoP binary (api-contracts-oop): bootstrap + embedded authn stack. Add
# `grpc-server` to serve PaymentApi over gRPC as well.
oop_module = [
    "dep:tokio",
    "dep:clap",
    "dep:mimalloc",
    "toolkit/bootstrap",
    "dep:authn-resolver",
    "dep:static-authn-plugin",
    "dep:types-registry",
]
# Kubernetes TokenReview platform-plane auth.
k8s-auth = ["toolkit/k8s-auth", "grpc_hub?/k8s-auth"]

[lints]
workspace = true

[[bin]]
name = "api-contracts-oop"
path = "src/main.rs"
required-features = ["oop_module"]

[dependencies]
# rest-server to serve the contract; rest-client for the resolving client
# used in tests.
api-contracts-sdk = { workspace = true, features = ["rest-client", "rest-server"] }
toolkit-contract = { workspace = true, features = ["runtime-client", "rest-server"] }
toolkit.workspace = true
toolkit-macros.workspace = true
toolkit-canonical-errors.workspace = true
toolkit-security.workspace = true
async-trait.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
uuid.workspace = true
anyhow.workspace = true
futures-core.workspace = true
futures-util.workspace = true
async-stream = "0.3"
axum.workspace = true

tonic = { workspace = true, features = ["transport"], optional = true }
toolkit-transport-grpc = { workspace = true, optional = true }
grpc_hub = { workspace = true, optional = true }
authn-resolver-sdk = { package = "cf-gears-authn-resolver-sdk", version = "0.3.41", path = "../../../../gears/system/authn-resolver/authn-resolver-sdk", optional = true }

# OoP-only, gated behind `oop_module`.
tokio = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
authn-resolver = { package = "cf-gears-authn-resolver", path = "../../../../gears/system/authn-resolver/authn-resolver", optional = true }
static-authn-plugin = { package = "cf-gears-static-authn-plugin", path = "../../../../gears/system/authn-resolver/plugins/static-authn-plugin", optional = true }
types-registry = { package = "cf-gears-types-registry", path = "../../../../gears/system/types-registry/types-registry", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
toolkit-resilience = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
toolkit-canonical-errors.workspace = true
mockall.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
