# toolkit-db's clippy configuration.
#
# Clippy reads only the nearest clippy.toml and does not merge configs, so this file is a copy of
# libs/.clippy.toml with toolkit-db's own rules added below. Keep the copied part in step with
# libs/.clippy.toml.

# Gears Toolkit allowed to have more complex logic than gears
cognitive-complexity-threshold = 55
type-complexity-threshold = 220

# Function length threshold (default is 100)
too-many-lines-threshold = 200

# Allow unwrap/expect in tests and doctests (they should panic on failure)
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# toolkit-db only: every top-level transaction begins in tx_begin::begin, which runs the BEGIN in
# a task of its own so a cancelled caller cannot leave a pooled connection inside a transaction.
# Enforced by `#![deny(clippy::disallowed_methods)]` in src/lib.rs.
disallowed-methods = [
    { path = "sea_orm::TransactionTrait::begin", reason = "use tx_begin::begin for a top-level transaction" },
    { path = "sea_orm::TransactionTrait::begin_with_config", reason = "use tx_begin::begin for a top-level transaction" },
    { path = "sea_orm::TransactionTrait::begin_with_options", reason = "use tx_begin::begin for a top-level transaction" },
    { path = "sea_orm::TransactionTrait::transaction", reason = "use tx_begin::begin for a top-level transaction" },
    { path = "sea_orm::TransactionTrait::transaction_with_config", reason = "use tx_begin::begin for a top-level transaction" },
]
